name: Public source checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check public files
        run: python3 tools/check_public_source.py
      - name: Check the mission-maker guide covers every setting and host option
        run: python3 tools/check_mission_doc.py
      - name: Check Enforce number traps
        run: python3 tools/check_enforce_numbers.py
      - name: Check the static-initializer budget
        run: python3 tools/check_static_init.py
      - name: Check AI squad jobs change only through SetAITask
        run: python3 tools/check_ai_task_writes.py
      - name: Test the nightly sweep's result parsing
        run: python3 -m unittest discover -s tools/sweep
