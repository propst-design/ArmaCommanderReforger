name: Public source checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check public files
        run: python3 tools/check_public_source.py
      - name: Check the mission-maker guide covers every setting and host option
        run: python3 tools/check_mission_doc.py
