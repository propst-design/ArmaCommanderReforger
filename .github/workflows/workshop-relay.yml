name: Workshop changelog relay

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Initialize once before polling; recover only after checking Discord'
        type: choice
        options: [poll, initialize, recover]
        default: poll
      mod:
        description: 'Recovery only: exact Workshop mod ID'
        type: string
        default: ''
      version:
        description: 'Recovery only: exact uncertain version'
        type: string
        default: ''
      part:
        description: 'Recovery only: uncertain part number (starts at 1)'
        type: string
        default: '0'
      decision:
        description: 'Recovery only: delivered if visible in Discord; retry ONLY if absent'
        type: choice
        options: [delivered, retry]
        default: delivered

permissions:
  contents: write

concurrency:
  group: workshop-changelog-relay
  cancel-in-progress: false

jobs:
  relay:
    if: github.repository == 'propst-design/ArmaCommanderReforger' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Relay published Workshop changelogs
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REFORGERMODS_API_KEY: ${{ secrets.REFORGERMODS_API_KEY }}
          MODE: ${{ inputs.mode || 'poll' }}
          RECOVERY_MOD: ${{ inputs.mod }}
          RECOVERY_VERSION: ${{ inputs.version }}
          RECOVERY_PART: ${{ inputs.part || '0' }}
          RECOVERY_DECISION: ${{ inputs.decision || 'delivered' }}
        run: >-
          python3 tools/workshop_relay/relay.py
          --mode "$MODE" --mod "$RECOVERY_MOD" --version "$RECOVERY_VERSION"
          --part "$RECOVERY_PART" --decision "$RECOVERY_DECISION"
